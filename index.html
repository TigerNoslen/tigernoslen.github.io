<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tiger Nation HQ | Tiger Noslen Gaming</title>
    <meta name="description" content="Official website of Tiger Noslen Gaming. Live streams, Fortnite content, community, Creator Code, and more.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">
    <div class="nav-container">

        <a href="#hero" class="site-logo" aria-label="Tiger Nation HQ home">
            <img
                src="images/logos/tng-logo.png"
                alt="Tiger Noslen Gaming"
            >
        </a>

        <nav class="main-nav" aria-label="Main navigation">
            <ul class="nav-links">
                <li><a href="#hero" class="active">Home</a></li>
                <li><a href="#schedule">Streams</a></li>
                <li><a href="#fortnite">Fortnite</a></li>
                <li><a href="#community">Community</a></li>
                <li><a href="#connect">Connect</a></li>
            </ul>
        </nav>

        <div class="nav-actions">
            <div class="live-indicator">
                <span class="live-dot" aria-hidden="true"></span>
                <span>Live Now</span>
            </div>

            <a href="#" class="watch-live-button">
                <span aria-hidden="true">◉</span>
                Watch Live
            </a>

            <button
                class="mobile-menu-button"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

    </div>
</header>

<main>

    <section id="hero" class="hero-section">
    <div class="hero-overlay"></div>

    <div class="hero-container">
        <div class="hero-content">

            <p class="hero-kicker">Welcome to</p>

            <h1 class="hero-title">
                <span>Tiger Nation</span>
                <strong>HQ</strong>
            </h1>

            <p class="hero-description">
                The official home of Tiger Noslen Gaming.
                Live streams, Fortnite content, community,
                and everything Tiger Nation.
            </p>

            <div class="hero-actions">
                <a href="#" class="hero-button hero-button-primary">
                    <span aria-hidden="true">▶</span>
                    Watch Live
                </a>

                <a href="#" class="hero-button hero-button-secondary">
                    Join Discord
                </a>
            </div>

            <div class="hero-status">
                <span class="hero-status-dot" aria-hidden="true"></span>
                <strong>Live Now</strong>
                <span>Fortnite Zero Build</span>
            </div>

        </div>

        <div class="hero-visual">
            <div class="hero-glow"></div>

            <img
                src="images/mascot/hero-mascot.png"
                alt="Tiger Noslen Gaming mascot"
                class="hero-mascot"
            >
        </div>
    </div>
</section>

    <section id="about">
        <!-- About -->
    </section>

    <section id="schedule">
        <!-- Schedule -->
    </section>

    <section id="creator-code">
        <!-- Creator Code -->
    </section>

    <section id="fortnite">
        <!-- Fortnite -->
    </section>

    <section id="community">
        <!-- Community -->
    </section>

</main>

<footer>
    <!-- Footer -->
</footer>

<script src="js/script.js"></script>

</body>
</html>
